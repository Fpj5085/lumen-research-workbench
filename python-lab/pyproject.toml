[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-python-lab"
version = "0.1.0"
description = "LUMEN Python Lab: an independent synthetic-data FastAPI experiment (local, in-memory, non-production)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "anyio>=4.4,<5.0",
    # 9.0.3 is the first release that fixes PYSEC-2026-1845 (CVE-2025-71176).
    "pytest>=9.0.3,<10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "anyio: async tests driven by the anyio plugin",
]

